<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8EFEA" />
    <title>Veterinaria Patitas amigas</title>
    <meta name="description" content="App para clientes de la Veterinaria Patitas amigas: mascotas, vacunas, turnos, recordatorios y tienda." />
    <link rel="icon" href="/img/logo-verde.webp" type="image/webp" />
    <link rel="preload" href="/fonts/sofia-sans-extra-condensed-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/sofia-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-mono-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Si la app no llega a arrancar, muestra el error en lugar de una pantalla vacía.
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root');
        if (root && !root.children.length) root.textContent = 'No se pudo cargar la app: ' + (e.message || e.type);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
